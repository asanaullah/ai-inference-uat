# Assisted by Claude Opus 4.6
apiVersion: uat.openshift.io/v1
kind: TestSuite
metadata:
  name: inference-validation-suite
  version: v0.0.1
spec:
  tests:
    - name: platform-check
      scope: project
      onFailure: continue
    - name: component
      scope: node
      onFailure: continue
    - name: inference
      scope: node
      onFailure: abort
      timeout: 1200
    - name: iperf3
      scope: cluster
      onFailure: continue
      placement:
        setType: permutation
        setSize: 2
        setSelection: all
        setCutoff: 0
