# Assisted by Claude Opus 4.6
apiVersion: uat.openshift.io/v1
kind: TestSuite
metadata:
  name: inference-validation-suite
  version: v0.0.1
spec:
  tests:
    # preflight
    - name: platform-check
      scope: project
      onFailure: continue
    - name: component
      scope: node
      onFailure: continue
    - name: iperf3
      scope: cluster
      onFailure: continue
      placement:
        setType: permutation
        setSize: 2
        setSelection: all
        setCutoff: 0
    - name: ping
      scope: project
      onFailure: continue
    - name: dev-env
      scope: node
      onFailure: continue
      timeout: 600
    # operator
    - name: kserve
      scope: node
      onFailure: continue
      timeout: 900
    # single-gpu-performance
    - name: guidellm
      scope: node
      onFailure: abort
      timeout: 1200
    - name: inference-perf
      scope: node
      onFailure: abort
      timeout: 1200
    # multi-gpu-performance
    - name: chunked-prefill
      scope: node
      onFailure: abort
      timeout: 900
    - name: llm-d-local
      scope: node
      onFailure: abort
      timeout: 900
