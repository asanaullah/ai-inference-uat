# Assisted by Claude Opus 4.6
apiVersion: uat.openshift.io/v1
kind: Test
metadata:
  name: component
  version: v0.0.1
  description: Validate node hardware and software against cluster specification
  supportedScopes:
    - node
    - cluster
spec:
  source:
    ginkgo: component.go

  dag:
    - name: test-runner
      image: registry.redhat.io/ubi9/ubi:9.8
      labelFilter: pass-fail
      resources:
        requests:
          nvidia.com/gpu: '{{ nodeSpec.componentValidation.sanity["nvidia.com/gpu"] }}'
        limits:
          nvidia.com/gpu: '{{ nodeSpec.componentValidation.sanity["nvidia.com/gpu"] }}'
      env:
        - name: NODE_NAME
          value: '{{ nodeSpec.name }}'
      privileged: false
      persistsThroughSweep: false
      parameterSweep: null
