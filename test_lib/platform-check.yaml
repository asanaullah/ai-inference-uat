# Assisted by Claude Opus 4.6
apiVersion: uat.openshift.io/v1
kind: Test
metadata:
  name: platform-check
  version: v0.0.1
  description: Validate platform RBAC, API groups, and operator CRD registration
  supportedScopes:
    - node
    - cluster
    - project
spec:
  source:
    ginkgo: platform-check.go

  serverConfig:
    checks:
      # RBAC sandbox verification
      - type: permission
        verb: get
        resource: pods
        expected: "no"
      - type: permission
        verb: create
        resource: pods
        expected: "no"
      - type: permission
        verb: get
        resource: secrets
        expected: "no"
      - type: permission
        verb: get
        resource: nodes
        expected: "no"

      # Required API groups
      - type: apiGroup
        group: kubeflow.org
        expected: "yes"
      - type: apiGroup
        group: serving.kserve.io
        expected: "yes"
      - type: apiGroup
        group: ray.io
        expected: "yes"
      - type: apiGroup
        group: nonexistent.example.io
        expected: "no"

      # RHOAI operator
      - type: crd
        apiVersion: datasciencecluster.opendatahub.io/v1
        kind: DataScienceCluster
        expected: "yes"
      - type: crd
        apiVersion: dscinitialization.opendatahub.io/v1
        kind: DSCInitialization
        expected: "yes"

      # GPU operator
      - type: crd
        apiVersion: nvidia.com/v1
        kind: ClusterPolicy
        expected: "yes"

      # Node Feature Discovery
      - type: crd
        apiVersion: nfd.openshift.io/v1
        kind: NodeFeatureDiscovery
        expected: "yes"

      # OpenShift Serverless (KNative)
      - type: crd
        apiVersion: operator.knative.dev/v1beta1
        kind: KnativeServing
        expected: "yes"

      # Service Mesh
      - type: crd
        apiVersion: maistra.io/v2
        kind: ServiceMeshControlPlane
        expected: "yes"

  dag:
    - name: checker
      image: registry.redhat.io/ubi9/ubi:9.8
      labelFilter: pass-fail
      env:
        - name: PERMISSION_CHECKS
          value: '{{ serverConfig.checks | toJson }}'
