# Assisted by Claude Opus 4.8
apiVersion: uat.openshift.io/v1
kind: ClusterTest
metadata:
  name: oac-prod-uat
spec:
  compliance:
    fipsEnabled: false

  nodes:
    - name: moc-r4pcc02u05
      componentValidation:
        sanity:
          nvidia.com/gpu: 4
          nvidia.com/gpu.memory: 81559
          cpu: 512
          resourceNames:
            nvidia.com/gpu: NVIDIA-H100-80GB-HBM3
            cpu: AMD EPYC 9754 128-Core Processor
          nvlink: NV6
          nvlinkTopology: all-to-all
          nvlinkP2pBandwidth: 150
          pcieWidth: 16
          pcieGen: 5
          memory: 1512Gi
          numaNodes: 2
        ideal:
          cudaDriverVersion: "595.91.07"
          gpuPowerLimit: 700
          gpuPersistenceMode: true
          kernel: 5.14.0-570.78.1.el9_6.x86_64
          hugepages: 8000Mi
          cpuFreqGovernor: performance
          cpuIdleDriver: acpi_idle
          cpuIdleGovernor: menu
          # AMD acpi_idle C2 is equivalent to Intel C1E (low single-digit us wake-up)
          cpuCStatesEnabled: [POLL, C1, C2]
          transparentHugepages: madvise

    - name: moc-r4pcc02u09
      componentValidation:
        sanity:
          nvidia.com/gpu: 4
          nvidia.com/gpu.memory: 81559
          cpu: 512
          resourceNames:
            nvidia.com/gpu: NVIDIA-H100-80GB-HBM3
            cpu: AMD EPYC 9754 128-Core Processor
          nvlink: NV6
          nvlinkTopology: all-to-all
          nvlinkP2pBandwidth: 150
          pcieWidth: 16
          pcieGen: 5
          memory: 1512Gi
          numaNodes: 2
        ideal:
          cudaDriverVersion: "595.91.07"
          gpuPowerLimit: 700
          gpuPersistenceMode: true
          kernel: 5.14.0-570.78.1.el9_6.x86_64
          hugepages: 8000Mi
          cpuFreqGovernor: performance
          cpuIdleDriver: acpi_idle
          cpuIdleGovernor: menu
          # AMD acpi_idle C2 is equivalent to Intel C1E (low single-digit us wake-up)
          cpuCStatesEnabled: [POLL, C1, C2]
          transparentHugepages: madvise


  namespace: uat-project
  peerNamespace: uat-peer

  storage:
    pvc: uat-project-storage
    basePath: uat/results
    models:
      pvc: uat-models

  peerStorage:
    pvc: uat-peer-storage
    basePath: uat/results
    models:
      pvc: uat-models
