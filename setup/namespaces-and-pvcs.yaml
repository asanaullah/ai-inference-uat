# Assisted by Claude Opus
# ---- Namespaces ----
apiVersion: v1
kind: Namespace
metadata:
  name: uat-project
  labels:
    massopen.cloud/project: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: uat-peer
  labels:
    massopen.cloud/project: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: uat-admin
  labels:
    massopen.cloud/project: "true"
---
# ---- PVCs ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-project-storage
  namespace: uat-project
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-peer-storage
  namespace: uat-peer
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-admin-storage
  namespace: uat-admin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 100Gi
---
# ---- uat-admin ServiceAccount ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-sa
  namespace: uat-admin
---
# ---- uat-project RBAC ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-user-role
  namespace: uat-project
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs", "tfjobs", "mpijobs", "xgboostjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters", "rayservices"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-user-binding
  namespace: uat-project
subjects:
  - kind: User
    name: asanaull@redhat.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- uat-peer RBAC ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-user-role
  namespace: uat-peer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-user-binding
  namespace: uat-peer
subjects:
  - kind: User
    name: asanaull@redhat.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- uat-admin RBAC (namespace-scoped) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-admin-role
  namespace: uat-admin
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-sa-admin-role
  namespace: uat-admin
subjects:
  - kind: ServiceAccount
    name: uat-sa
    namespace: uat-admin
roleRef:
  kind: Role
  name: uat-admin-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-user-binding
  namespace: uat-admin
subjects:
  - kind: User
    name: asanaull@redhat.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-admin-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- uat-admin RBAC (cluster-scoped, for Category 2 checks) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uat-admin-cluster-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["datasciencecluster.opendatahub.io"]
    resources: ["datascienceclusters"]
    verbs: ["get", "list"]
  - apiGroups: ["dscinitialization.opendatahub.io"]
    resources: ["dscinitializations"]
    verbs: ["get", "list"]
  - apiGroups: ["nvidia.com"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["nfd.openshift.io"]
    resources: ["nodefeaturediscoveries"]
    verbs: ["get", "list"]
  - apiGroups: ["maistra.io"]
    resources: ["servicemeshcontrolplanes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uat-sa-admin-cluster-role
subjects:
  - kind: ServiceAccount
    name: uat-sa
    namespace: uat-admin
roleRef:
  kind: ClusterRole
  name: uat-admin-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- uat-runner Namespace ----
apiVersion: v1
kind: Namespace
metadata:
  name: uat-runner
  labels:
    massopen.cloud/project: "true"
---
# ---- uat-runner PVC (repo clone, build outputs, per-run logs + metadata) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-runner-storage
  namespace: uat-runner
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 100Gi
---
# ---- uat-runner bin PVC (holds the oc binary staged by the init container) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-runner-bin
  namespace: uat-runner
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 2Gi
---
# ---- uat-runner ServiceAccount (drives runs unattended) ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-runner-sa
  namespace: uat-runner
---
# ---- uat-runner self-namespace Role (inspect its own runner pod + config) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-runner-role
  namespace: uat-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-self-binding
  namespace: uat-runner
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-runner-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- Bind uat-runner-sa to the test-user role in each target namespace ----
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-project-binding
  namespace: uat-project
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-peer-binding
  namespace: uat-peer
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
