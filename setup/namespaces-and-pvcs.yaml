# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Namespace
metadata:
  name: uat-project
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-project-storage
  namespace: uat-project
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 100Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-user-role
  namespace: uat-project
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs", "tfjobs", "mpijobs", "xgboostjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters", "rayservices"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-user-asanaullah
  namespace: uat-project
subjects:
  - kind: User
    name: asanaullah
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-monitoring-sa
  namespace: uat-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-monitoring-role
  namespace: uat-project
rules:
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["inference.networking.x-k8s.io"]
    resources: ["inferencepools", "inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["llm-d.ai"]
    resources: ["inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-monitoring-role-binding
  namespace: uat-project
subjects:
  - kind: ServiceAccount
    name: uat-monitoring-sa
    namespace: uat-project
roleRef:
  kind: Role
  name: uat-monitoring-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-log-reader
  namespace: uat-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-log-reader-role
  namespace: uat-project
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-log-reader-binding
  namespace: uat-project
subjects:
  - kind: ServiceAccount
    name: uat-log-reader
    namespace: uat-project
roleRef:
  kind: Role
  name: uat-log-reader-role
  apiGroup: rbac.authorization.k8s.io
